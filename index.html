<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Anchor Project</title>
    <!-- We link our CSS file here so the browser knows how to style this page -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Student-Athlete Command Center</h1>
        <p>Manage your schedule and responsabilities. Protect your well-being. Stay focused.</p>
    </header>
    <main>
        <!-- The Input Section: Where the user adds new tasks -->
        <section id="input-section">
            <input type="text" id="task-title" placeholder="Task Title (e.g., Chem Homework, Tennis Practice)">
            <select id="task-type">
                <option value="academic">📚 Academics</option>
                <option value="sport">🏃 Sport</option>
                <option value="personal">Personal Life</option>
                <option value="extracurricular">Extracurriculars</option>
<input type="time" id="task-start-time">
<input type="time" id="task-end-time">  
            </select>
            <select id="task-energy">
    <option value="low">🥱 Low Energy</option>
    <option value="medium">⚖️ Medium Energy</option>
    <option value="high">⚡ High Energy</option>
</select>
<select id="task-stress">
    <option value="low">😌 Low Stress</option>
    <option value="medium">😅 Medium Stress</option>
    <option value="high">😓 High Stress</option>
</select>
            <input type="date" id="task-date">
            <button id="add-btn">Add Task</button>
        </section>
        <!-- The Display Section: Where the tasks will appear -->
        <section id="task-list">
            <!-- JavaScript will insert tasks here -->
        </section>
        <div class="container">
    <!-- Main Command Center -->
    <main>
        <!-- ... your existing inputs and task list ... -->
    </main>
    <!-- New Side Panel for Completed Tasks -->
    <aside id="completed-tracker">
        <h2>✅ Completed Tasks</h2>
        <div id="completed-list"></div>
        <button id="clear-completed">Clear History</button>
    </aside>
</div>
</div>
</ul>
    </main>
    <!-- We link our JavaScript file here so the browser knows the logic -->
    <script src="script.js"></script>
</body>
</html>
